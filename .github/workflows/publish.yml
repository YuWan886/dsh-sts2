name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment configured in the npm Trusted Publisher settings.
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing requires npm 11.5.1+.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Test
        run: npm test

      # Auth and provenance both come from the OIDC token; no NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --access public
